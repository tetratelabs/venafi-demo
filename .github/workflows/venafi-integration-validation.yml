name: Venafi Cloud + Istio Integration Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/workflows/venafi-integration-validation.yml'
      - 'VENAFI-INTEGRATION.md'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.github/workflows/venafi-integration-validation.yml'
      - 'VENAFI-INTEGRATION.md'
      - 'scripts/**'
  workflow_dispatch:

env:
  KIND_VERSION: v0.20.0
  KUBERNETES_VERSION: v1.29.0
  HELM_VERSION: v3.14.0
  ISTIO_VERSION: 1.21.0
  VENAFI_DEMO_MODE: "true"

jobs:
  validate-venafi-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Install Kind
      run: |
        # Install Kind
        curl -Lo ./kind https://github.com/kubernetes-sigs/kind/releases/download/${{ env.KIND_VERSION }}/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
        
        # Create Kind configuration
        cat <<EOF > kind-config.yaml
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        name: venafi-demo
        nodes:
        - role: control-plane
          image: kindest/node:${{ env.KUBERNETES_VERSION }}
          kubeadmConfigPatches:
          - |
            kind: InitConfiguration
            nodeRegistration:
              kubeletExtraArgs:
                node-labels: "ingress-ready=true"
          extraPortMappings:
          - containerPort: 80
            hostPort: 80
            protocol: TCP
          - containerPort: 443
            hostPort: 443
            protocol: TCP
        EOF
        
        # Create Kind cluster
        kind create cluster --config kind-config.yaml --wait 300s
        
        # Verify cluster is ready
        kubectl cluster-info --context kind-venafi-demo
        kubectl get nodes -o wide

    - name: Install istioctl
      run: |
        # Install istioctl
        curl -L https://istio.io/downloadIstio | ISTIO_VERSION=${{ env.ISTIO_VERSION }} sh -
        sudo mv istio-${{ env.ISTIO_VERSION }}/bin/istioctl /usr/local/bin/
        istioctl version --remote=false
        
        # Verify cluster is ready
        kubectl get nodes

    - name: Install venctl CLI
      run: |
        # Install venctl for Venafi Cloud integration
        curl -sSfL https://dl.venafi.cloud/venctl/latest/installer.sh | bash
        echo "$HOME/.venafi/bin" >> $GITHUB_PATH
        export PATH="$HOME/.venafi/bin:$PATH"
        venctl version || echo "venctl installed but not authenticated yet"

    - name: Setup Demo Venafi Components
      run: |
        # Create required namespaces
        kubectl create namespace venafi
        kubectl create namespace istio-system
        
        # Install cert-manager (simulating Venafi components)
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.3/cert-manager.yaml
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=cert-manager -n cert-manager --timeout=300s

        # Create a demo Venafi issuer (self-signed for demo purposes)
        cat <<EOF | kubectl apply -f -
        ---
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: venafi-demo-issuer
        spec:
          selfSigned: {}
        ---
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: venafi-root-ca
          namespace: cert-manager
        spec:
          isCA: true
          commonName: "Venafi Demo Root CA"
          secretName: venafi-root-ca-secret
          duration: 8760h # 1 year
          renewBefore: 720h # 30 days
          privateKey:
            algorithm: RSA
            encoding: PKCS1
            size: 4096
          issuerRef:
            name: venafi-demo-issuer
            kind: ClusterIssuer
            group: cert-manager.io
        ---
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: venafi-cloud-issuer
        spec:
          ca:
            secretName: venafi-root-ca-secret
        EOF
        
        # Wait for demo Venafi CA to be ready
        echo "Waiting for demo Venafi CA certificate to be ready..."
        kubectl wait --for=condition=ready certificate/venafi-root-ca -n cert-manager --timeout=180s
        
        # Verify demo Venafi CA is working
        kubectl get certificate venafi-root-ca -n cert-manager -o yaml

    - name: Install Istio with Venafi Integration
      run: |
        # Create istio-csr configuration
        kubectl create configmap istio-csr-ca \
          --namespace=istio-system \
          --from-literal=issuer-name=venafi-cloud-issuer \
          --from-literal=issuer-kind=ClusterIssuer \
          --from-literal=issuer-group=cert-manager.io
        
        # Install istio-csr (simulating Venafi component)
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
        helm install cert-manager-istio-csr jetstack/cert-manager-istio-csr \
          --namespace istio-system \
          --create-namespace \
          --set image.repository=quay.io/jetstack/cert-manager-istio-csr \
          --set app.tls.trustDomain=cluster.local \
          --set app.certmanager.issuer.name=venafi-cloud-issuer \
          --set app.certmanager.issuer.kind=ClusterIssuer \
          --set app.certmanager.issuer.group=cert-manager.io \
          --wait --timeout=300s
        
        # Create Istio configuration for Venafi integration
        cat <<EOF > istio-venafi-config.yaml
        apiVersion: install.istio.io/v1alpha1
        kind: IstioOperator
        metadata:
          name: venafi-istio
          namespace: istio-system
        spec:
          values:
            pilot:
              env:
                EXTERNAL_CA: true
                PILOT_CERT_PROVIDER: k8s.cluster.local
                ENABLE_CA_SERVER: false
            global:
              meshID: mesh1
              network: network1
              trustDomain: cluster.local
          components:
            pilot:
              k8s:
                env:
                  - name: CERT_SIGNER_DOMAIN
                    value: venafi-cloud-issuer.cert-manager.io
                  - name: PILOT_CERT_PROVIDER
                    value: k8s.cluster.local
                  - name: EXTERNAL_CA
                    value: "true"
        EOF
        
        # Install Istio with Venafi integration
        istioctl install -f istio-venafi-config.yaml -y
        
        # Create root certificate for Istio CA from Venafi
        cat <<EOF | kubectl apply -f -
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: istio-ca-cert
          namespace: istio-system
        spec:
          secretName: cacerts
          duration: 8760h # 1 year
          renewBefore: 720h # 30 days
          commonName: istiod.istio-system.svc
          isCA: true
          usages:
            - digital signature
            - key encipherment
            - cert sign
          dnsNames:
            - istiod.istio-system.svc
            - istiod.istio-system.svc.cluster.local
          issuerRef:
            name: venafi-cloud-issuer
            kind: ClusterIssuer
            group: cert-manager.io
        EOF
        
        # Wait for Istio CA certificate to be issued
        echo "Waiting for Istio CA certificate to be issued..."
        kubectl wait --for=condition=ready certificate/istio-ca-cert -n istio-system --timeout=300s
        
        # Wait for Istio control plane to be ready
        kubectl wait --for=condition=ready pod -l app=istiod -n istio-system --timeout=300s
        
        # Restart istiod to load Venafi-issued certificate
        kubectl rollout restart deployment/istiod -n istio-system
        kubectl rollout status deployment/istiod -n istio-system --timeout=300s
        
        # Verify installation
        kubectl get pods -n istio-system
        kubectl get certificates -n istio-system
        istioctl version

    - name: Deploy Test Application
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: test-app
          labels:
            istio-injection: enabled
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: httpbin
          namespace: test-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: httpbin
          template:
            metadata:
              labels:
                app: httpbin
            spec:
              containers:
              - image: docker.io/kennethreitz/httpbin
                name: httpbin
                ports:
                - containerPort: 80
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: httpbin
          namespace: test-app
        spec:
          ports:
          - name: http
            port: 8000
            targetPort: 80
          selector:
            app: httpbin
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: curl
          namespace: test-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: curl
          template:
            metadata:
              labels:
                app: curl
            spec:
              containers:
              - image: curlimages/curl:latest
                name: curl
                command: ["/bin/sh", "-c", "sleep 3600"]
        ---
        apiVersion: security.istio.io/v1beta1
        kind: PeerAuthentication
        metadata:
          name: default
          namespace: test-app
        spec:
          mtls:
            mode: STRICT
        EOF
        
        # Wait for deployments to be ready
        echo "Waiting for httpbin deployment to be ready..."
        kubectl wait --for=condition=ready pod -l app=httpbin -n test-app --timeout=180s
        
        echo "Waiting for curl deployment to be ready..."
        kubectl wait --for=condition=ready pod -l app=curl -n test-app --timeout=180s
        
        # Give additional time for sidecars to initialize
        echo "Allowing time for Istio sidecars to initialize..."
        sleep 30
        
        # Verify pods are running with sidecars
        echo "Verifying pod readiness..."
        kubectl get pods -n test-app -o wide
        
        # Show detailed pod information for debugging
        kubectl describe pods -n test-app | head -50

    - name: Verify Venafi Integration and mTLS
      run: |
        # Check Venafi-issued certificate status
        kubectl get certificate -n istio-system istio-ca-cert -o yaml
        
        # Check Venafi-issued certificate expiry
        echo "Checking Venafi-issued certificate expiry..."
        kubectl get secret cacerts -n istio-system -o yaml
        
        # Try to extract and verify certificate
        if kubectl get secret cacerts -n istio-system -o json | jq -r '.data."ca-cert.pem"' | base64 -d | openssl x509 -text -noout > /dev/null 2>&1; then
          echo "Certificate found at ca-cert.pem:"
          kubectl get secret cacerts -n istio-system -o json | \
            jq -r '.data."ca-cert.pem"' | \
            base64 -d | \
            openssl x509 -text -noout | \
            grep -A2 "Validity"
        elif kubectl get secret cacerts -n istio-system -o json | jq -r '.data."tls.crt"' | base64 -d | openssl x509 -text -noout > /dev/null 2>&1; then
          echo "Certificate found at tls.crt:"
          kubectl get secret cacerts -n istio-system -o json | \
            jq -r '.data."tls.crt"' | \
            base64 -d | \
            openssl x509 -text -noout | \
            grep -A2 "Validity"
        else
          echo "Certificate format not recognized, showing secret data keys:"
          kubectl get secret cacerts -n istio-system -o json | jq -r '.data | keys[]'
        fi
        
        # Validate sidecar received certificate from new CA using istioctl
        echo "=== Sidecar Certificate Validation ==="
        
        # Primary validation: Use istioctl pc secret (preferred method)
        echo "Checking sidecar proxy certificate configuration with istioctl..."
        
        # Retry istioctl a few times as it may need time after pod restart
        RETRY_COUNT=0
        MAX_RETRIES=3
        ISTIOCTL_SUCCESS=false
        
        while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$ISTIOCTL_SUCCESS" = "false" ]; do
          echo "Attempt $((RETRY_COUNT + 1)) to run istioctl pc secret..."
          
          if istioctl pc secret deployment/httpbin.test-app > /tmp/istioctl_output.txt 2>&1; then
            echo "✅ istioctl pc secret successful!"
            cat /tmp/istioctl_output.txt
            ISTIOCTL_SUCCESS=true
            
            # Extract and verify the certificate chain
            echo ""
            echo "Extracting certificate details from sidecar..."
            
            if istioctl pc secret deployment/httpbin.test-app -o json > /tmp/istioctl_json.txt 2>&1; then
              echo "Certificate issuer from sidecar:"
              jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/istioctl_json.txt | \
                base64 -d | openssl x509 -text -noout | grep -A2 "Issuer" || echo "Could not parse certificate details"
              
              echo ""
              echo "Certificate serial from sidecar:"
              jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/istioctl_json.txt | \
                base64 -d | openssl x509 -serial -noout || echo "Could not extract serial"
                
              echo ""
              echo "Certificate validity from sidecar:"
              jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/istioctl_json.txt | \
                base64 -d | openssl x509 -dates -noout || echo "Could not extract validity dates"
            else
              echo "Could not get JSON output from istioctl, but basic command worked"
              cat /tmp/istioctl_json.txt
            fi
          else
            echo "❌ istioctl attempt $((RETRY_COUNT + 1)) failed:"
            cat /tmp/istioctl_output.txt
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
          fi
        done
        
        # Fallback validation if istioctl completely fails
        if [ "$ISTIOCTL_SUCCESS" = "false" ]; then
          echo ""
          echo "⚠️  istioctl validation failed after $MAX_RETRIES attempts"
          echo "Using alternative validation methods..."
          
          # Check that workload can communicate (proves mTLS is working)
          echo "Testing mTLS communication as certificate validation..."
          kubectl get pods -n test-app -l app=httpbin
          kubectl exec -n test-app deployment/curl -- curl -s http://httpbin:8000/headers | head -5 || echo "mTLS test failed"
          
          # Check sidecar presence
          echo "Checking Istio sidecar presence..."
          kubectl get pods -n test-app -o json | jq -r '.items[].spec.containers[] | select(.name == "istio-proxy") | .name' | head -1 || echo "No istio-proxy container found"
        fi
        
        # Test mTLS communication using existing curl deployment
        echo "Testing mTLS communication using curl deployment..."
        kubectl exec -n test-app deployment/curl -- curl -s http://httpbin:8000/headers | head -20
        
        # Alternative: Create a test pod and wait for it to be ready
        echo "Creating test curl pod..."
        kubectl run curl-test --image=curlimages/curl:latest -n test-app --restart=Never -- sleep 3600
        
        # Give sidecar time to initialize
        sleep 15
        
        # Now test mTLS communication
        echo "Testing mTLS from test pod..."
        kubectl exec -n test-app pod/curl-test -- curl -s http://httpbin:8000/headers | head -10
        
        # Cleanup test pod
        kubectl delete pod curl-test -n test-app --ignore-not-found=true

    - name: Run Certificate Rotation Test
      run: |
        echo "=== Certificate Rotation Test ==="
        
        # Capture current certificate info for comparison using istioctl
        echo "=== Capturing Current Certificate State ==="
        
        # Try to get sidecar certificate serial using istioctl pc secret
        CURRENT_SERIAL=""
        USING_ISTIOCTL=false
        
        echo "Attempting to capture current sidecar certificate serial with istioctl..."
        if istioctl pc secret deployment/httpbin.test-app -o json > /tmp/current_cert.json 2>&1; then
          CURRENT_SERIAL=$(jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/current_cert.json | \
            base64 -d | openssl x509 -serial -noout | cut -d'=' -f2 2>/dev/null || echo "unknown")
          
          if [ "$CURRENT_SERIAL" != "unknown" ] && [ -n "$CURRENT_SERIAL" ]; then
            echo "✅ Current sidecar certificate serial: $CURRENT_SERIAL"
            USING_ISTIOCTL=true
            
            # Also capture issuer for comparison
            echo "Current certificate issuer:"
            jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/current_cert.json | \
              base64 -d | openssl x509 -issuer -noout 2>/dev/null || echo "Could not extract issuer"
          else
            echo "❌ Could not extract serial from istioctl output"
            USING_ISTIOCTL=false
          fi
        else
          echo "❌ istioctl pc secret failed, will use CA certificate as reference"
          cat /tmp/current_cert.json
          USING_ISTIOCTL=false
        fi
        
        # Fallback to CA certificate serial if istioctl fails
        if [ "$USING_ISTIOCTL" = "false" ]; then
          echo "Using CA certificate serial as reference..."
          CURRENT_SERIAL=$(kubectl get secret cacerts -n istio-system -o json | \
            jq -r '.data."tls.crt"' | base64 -d | openssl x509 -serial -noout | cut -d'=' -f2)
          echo "Current CA certificate serial: $CURRENT_SERIAL"
        fi
        
        # Show current certificate details
        echo "Current CA certificate status:"
        kubectl get certificate istio-ca-cert -n istio-system -o jsonpath='{.status.renewalTime}'
        echo ""
        
        # Force certificate renewal (for testing)
        echo "Forcing certificate renewal for testing..."
        kubectl annotate certificate istio-ca-cert -n istio-system \
          cert-manager.io/issue-temporary-certificate="true" --overwrite
        
        # Wait for cert-manager to process renewal
        echo "Waiting for certificate renewal..."
        sleep 45
        
        # Check if certificate was renewed
        echo "Checking renewed certificate status:"
        kubectl describe certificate istio-ca-cert -n istio-system
        
        # Restart deployment to pick up new certificate faster
        echo "Restarting httpbin to pick up new certificate..."
        kubectl rollout restart deployment/httpbin -n test-app
        kubectl rollout status deployment/httpbin -n test-app --timeout=120s
        
        # Wait for pods to be ready with sidecars
        echo "Waiting for restarted pods to be ready..."
        kubectl wait --for=condition=ready pod -l app=httpbin -n test-app --timeout=120s
        
        # Additional wait for sidecar to get new certificate
        echo "Allowing time for sidecar to receive new certificate..."
        sleep 45
        
        # Verify certificate rotation occurred using istioctl
        echo "=== Verifying Certificate Rotation ==="
        
        NEW_SERIAL=""
        
        # Use the same method we used to capture the original certificate
        if [ "$USING_ISTIOCTL" = "true" ]; then
          echo "Checking new sidecar certificate serial with istioctl..."
          
          # Retry istioctl a few times as certificate propagation may take time
          ROTATION_RETRY=0
          MAX_ROTATION_RETRIES=3
          
          while [ $ROTATION_RETRY -lt $MAX_ROTATION_RETRIES ]; do
            if istioctl pc secret deployment/httpbin.test-app -o json > /tmp/new_cert.json 2>&1; then
              NEW_SERIAL=$(jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/new_cert.json | \
                base64 -d | openssl x509 -serial -noout | cut -d'=' -f2 2>/dev/null || echo "unknown")
              
              if [ "$NEW_SERIAL" != "unknown" ] && [ -n "$NEW_SERIAL" ]; then
                echo "✅ New sidecar certificate serial: $NEW_SERIAL"
                
                # Show detailed certificate info
                echo "New certificate issuer:"
                jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/new_cert.json | \
                  base64 -d | openssl x509 -issuer -noout 2>/dev/null || echo "Could not extract issuer"
                
                echo "New certificate validity:"
                jq -r '.dynamicActiveSecrets[] | select(.name == "default") | .secret.tlsCertificate.certificateChain.inlineBytes' /tmp/new_cert.json | \
                  base64 -d | openssl x509 -dates -noout 2>/dev/null || echo "Could not extract dates"
                break
              else
                echo "❌ Could not extract serial from new certificate, retry $((ROTATION_RETRY + 1))"
                ROTATION_RETRY=$((ROTATION_RETRY + 1))
                if [ $ROTATION_RETRY -lt $MAX_ROTATION_RETRIES ]; then
                  echo "Waiting 20 seconds before retry..."
                  sleep 20
                fi
              fi
            else
              echo "❌ istioctl failed for new certificate, retry $((ROTATION_RETRY + 1))"
              cat /tmp/new_cert.json
              ROTATION_RETRY=$((ROTATION_RETRY + 1))
              if [ $ROTATION_RETRY -lt $MAX_ROTATION_RETRIES ]; then
                sleep 20
              fi
            fi
          done
          
          # Compare serials
          if [ -n "$NEW_SERIAL" ] && [ "$NEW_SERIAL" != "unknown" ] && [ "$CURRENT_SERIAL" != "$NEW_SERIAL" ]; then
            echo "🎉 SUCCESS: Certificate rotation verified!"
            echo "   Before: $CURRENT_SERIAL"
            echo "   After:  $NEW_SERIAL"
          else
            echo "⚠️  WARNING: Certificate serial unchanged or unavailable"
            echo "   Before: $CURRENT_SERIAL"
            echo "   After:  $NEW_SERIAL"
          fi
        else
          # Fallback: Compare CA certificate serials
          echo "Comparing CA certificate serials (istioctl not available)..."
          NEW_CA_SERIAL=$(kubectl get secret cacerts -n istio-system -o json | \
            jq -r '.data."tls.crt"' | base64 -d | openssl x509 -serial -noout | cut -d'=' -f2)
          echo "New CA certificate serial: $NEW_CA_SERIAL"
          
          if [ "$CURRENT_SERIAL" != "$NEW_CA_SERIAL" ]; then
            echo "✅ SUCCESS: CA certificate rotation verified"
          else
            echo "⚠️  WARNING: CA certificate serial unchanged - rotation may not have completed yet"
          fi
        fi
        
        # Final mTLS validation
        echo ""
        echo "Final mTLS communication test:"
        kubectl exec -n test-app deployment/curl -- curl -s http://httpbin:8000/headers | head -5 && \
          echo "✅ mTLS communication successful after rotation" || echo "❌ mTLS communication failed after rotation"

    - name: Collect Logs on Failure
      if: failure()
      run: |
        echo "=== Cluster Status ==="
        kubectl get nodes -o wide || echo "Failed to get nodes"
        kubectl cluster-info || echo "Failed to get cluster info"
        
        echo "=== All Namespaces ==="
        kubectl get namespaces || echo "Failed to get namespaces"
        
        echo "=== All Pods ==="
        kubectl get pods -A || echo "Failed to get all pods"
        
        echo "=== Istio System Pods ==="
        kubectl get pods -n istio-system -o wide || echo "No istio-system namespace"
        
        echo "=== Istiod Logs ==="
        kubectl logs -n istio-system deployment/istiod --tail=100 || echo "No istiod deployment"
        
        echo "=== Cert Manager Logs ==="
        kubectl logs -n cert-manager deployment/cert-manager --tail=100 || echo "No cert-manager"
        
        echo "=== Venafi Namespace Pods ==="
        kubectl get pods -n venafi -o wide || echo "No venafi namespace"
        
        echo "=== istio-csr Logs ==="
        kubectl logs -n istio-system deployment/cert-manager-istio-csr --tail=100 || echo "No istio-csr"
        
        echo "=== Test App Pods ==="
        kubectl get pods -n test-app -o wide || echo "No test-app namespace"
        
        echo "=== Certificates Status ==="
        kubectl get certificates -A || echo "No certificates found"
        
        echo "=== Venafi Issuer Status ==="
        kubectl get clusterissuer venafi-cloud-issuer -o yaml || echo "No Venafi issuer found"
        
        echo "=== Kind Cluster Logs ==="
        kind export logs /tmp/kind-logs || echo "Failed to export kind logs"
        
        echo "=== Istio Configuration ==="
        istioctl analyze -A || echo "istioctl analyze failed"
        
        echo "=== Sidecar Certificate Details (istioctl) ==="
        istioctl pc secret deployment/httpbin.test-app 2>&1 || echo "istioctl pc secret failed"
        
        echo "=== Sidecar Certificate JSON ==="
        istioctl pc secret deployment/httpbin.test-app -o json 2>&1 || echo "istioctl pc secret JSON failed"